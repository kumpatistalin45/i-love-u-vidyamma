
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sri Vidya 💖</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Satisfy&family=Tangerine:wght@400;700&family=Pacifico&family=Dancing+Script:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Quicksand',sans-serif;
}

body{
height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background: linear-gradient(135deg, #ffe6f0, #ffd4e8, #fff0f9);
background-size:400% 400%;
color:#6b0e41;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.glass{

width:90%;
max-width:700px;

padding:40px;

text-align:center;

background:rgba(255,255,255,.25);

border:2px solid rgba(255,255,255,.3);

backdrop-filter:blur(20px);

border-radius:30px;

box-shadow:
0 8px 32px rgba(255,105,180,.3);

z-index:2;
}

.logo{

position:absolute;

top:20px;
left:20px;

padding:10px 20px;

background:rgba(255,255,255,.3);

border-radius:50px;

font-weight:bold;

color:#ff69b4;

z-index:2;
}

h1{

font-family:'Tangerine',cursive;
font-size:3rem;
font-weight:700;
letter-spacing:0.5px;

color:#ff69b4;

margin-bottom:20px;
}

p{

font-family:'Quicksand',sans-serif;
font-size:1.2rem;
font-weight:500;

line-height:1.8;

color:#d946a6;
}

button{

font-family:'Dancing Script',cursive;
font-weight:600;
letter-spacing:0.5px;
margin-top:25px;

padding:15px 35px;

border:none;

border-radius:50px;

font-size:18px;

cursor:pointer;

background:
linear-gradient(
45deg,
#ff69b4,
#ffb3d9
);

color:white;

transition:.3s;
}

button:hover{

transform:scale(1.1);

box-shadow:0 0 30px #ff69b4;
}

/* Floating Hearts */

.heart{

position:absolute;

font-size:30px;

pointer-events:none;

animation:
floatHeart 10s linear forwards;
}

@keyframes floatHeart{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}
}

/* Sparkles */

.sparkle{

position:absolute;

color:white;

font-size:20px;

animation:
sparkle 4s linear forwards;
}

@keyframes sparkle{

0%{
opacity:0;
transform:scale(.5);
}

50%{
opacity:1;
}

100%{
opacity:0;
transform:scale(2);
}
}

</style>
</head>

<body>

<div class="logo">
J 💖 S
</div>

<div class="glass">

<h1>
✨ Hey Sri Vidya ✨
</h1>

<p>

A special journey is waiting for you...

This isn't just a website.

It's a collection of memories,
surprises,
and feelings made especially for you 💖

</p>

<button onclick="startJourney()">

Begin Journey 🚀

</button>

</div>

<script>

function startJourney(){

window.location.href="page2.html";

}

/* Floating Hearts */

setInterval(()=>{

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML=
["💖","💕","💗","💓","💘","💞"][Math.floor(Math.random()*6)];

heart.style.left=
Math.random()*100+"vw";

heart.style.fontSize=
(20+Math.random()*30)+"px";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

},300);

/* Sparkles */

setInterval(()=>{

let star=document.createElement("div");

star.classList.add("sparkle");

star.innerHTML="✨";

star.style.left=
Math.random()*100+"vw";

star.style.top=
Math.random()*100+"vh";

document.body.appendChild(star);

setTimeout(()=>{
star.remove();
},4000);

},500);

</script>

<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script src="music.js"></script>
</body>
</html>
