<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 2 - Secret Question 💖</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Satisfy&family=Tangerine:wght@400;700&family=Pacifico&family=Dancing+Script:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Quicksand',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg, #ffe6f0, #ffd4e8, #fff0f9);
background-size: 400% 400%;
color: #6b0e41;
animation:gradientMove 10s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hidden{
display:none;
}

.glass,
#introBox{

width:90%;
max-width:700px;

padding:40px;

text-align:center;

background:rgba(255,245,250,0.95);

border:1px solid rgba(255,105,180,.22);

backdrop-filter:blur(24px);

border-radius:30px;

box-shadow:0 8px 32px rgba(255,105,180,.18);
}

#introBox{
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.show{
animation:zoomIn .8s ease;
}

@keyframes zoomIn{
0%{
transform:scale(.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

h1{
font-family:'Tangerine',cursive;
font-size:2.5rem;
font-weight:700;
color:#ff69b4;
margin-bottom:20px;
}

p{
font-family:'Quicksand',sans-serif;
font-size:1.2rem;
font-weight:500;
color:#6b0e41;
margin-bottom:20px;
line-height:1.6;
}

input{
font-family:'Quicksand',sans-serif;
width:80%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:500;
text-align:center;
outline:none;
background: rgba(255,255,255,0.8);
color: #ff69b4;
}

button{
font-family:'Dancing Script',cursive;
font-weight:600;
margin-top:15px;
padding:15px 30px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:18px;
color:white;
background:linear-gradient(45deg,#ff69b4,#ffb3d9);
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#hint{
margin-top:15px;
font-weight:bold;
color:#ff1493;
}

.shake{
animation:shake .4s;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-10px);}
100%{transform:translateX(0);}
}

.heart{
position:absolute;
font-size:25px;
pointer-events:none;
animation:floatHeart 10s linear forwards;
}

@keyframes floatHeart{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

.progress{
position:fixed;
top:0;
left:0;
height:8px;
width:20%;
background:#ff1493;
}

</style>
</head>

<body>

<div class="progress"></div>

<div id="introBox">

<h1>💌</h1>

<p>
A Secret Question Awaits You...
</p>

<button onclick="openQuestion()">
Open Secret Question 💖
</button>

</div>

<div class="glass hidden" id="questionBox">

<h1>🔐 Secret Question</h1>

<p>
When we met first?
</p>

<input
type="text"
id="answer"
name="secretAnswer"
placeholder="Type answer here"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false">

<br>

<button onclick="checkAnswer()">
Unlock 🔓
</button>

<button onclick="showHint()">
Hint 👀
</button>

<p id="hint"></p>

</div>

<script>

window.onload=function(){

const input=document.getElementById("answer");

input.setAttribute("autocomplete","off");
input.value="";

};

function openQuestion(){

document.getElementById("introBox").style.display="none";

let box=document.getElementById("questionBox");

box.classList.remove("hidden");
box.classList.add("show");

}

function checkAnswer(){

let answer=document.getElementById("answer")
.value
.toLowerCase()
.trim();

if(answer==="may 20"){

document.body.innerHTML+=`

<div id="successScreen"

style="

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(255,192,203,.95);

display:flex;

justify-content:center;
align-items:center;

flex-direction:column;

font-size:2rem;

color:#ff1493;

z-index:9999;

">

<h1>💖 Correct 💖</h1>

<p>
Page 3 Unlocking...
</p>

</div>

`;

setTimeout(()=>{

window.location.href="page3.html";

},3000);

}

else{

let input=document.getElementById("answer");

input.classList.add("shake");

setTimeout(()=>{

input.classList.remove("shake");

},500);

alert("Wrong Answer ❌");

}

}

function showHint(){

document.getElementById("hint").innerHTML=
"Hint: It's Our first meeting date! ";

}

setInterval(()=>{

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML=["💖","💕","💗","💓","💘","💞"][Math.floor(Math.random()*6)];

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},10000);

},300);

</script>

<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script src="music.js"></script>

</body>
</html>
