<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 3 💖</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Satisfy&family=Tangerine:wght@400;700&family=Pacifico&family=Dancing+Script:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Quicksand',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffe6f0,#ffd4e8,#fff0f9);
background-size:400% 400%;
color:#6b0e41;
}

.progress{
position:fixed;
top:0;
left:0;
height:8px;
width:30%;
background:#ff1493;
}

.glass{
width:90%;
max-width:700px;
padding:40px;
text-align:center;
background:rgba(255,245,250,.95);
border:1px solid rgba(255,105,180,.22);
backdrop-filter:blur(24px);
border-radius:30px;
box-shadow:0 8px 32px rgba(255,105,180,.18);
}

.couple{
font-size:80px;
margin-bottom:20px;
animation:move 2s infinite alternate;
}

@keyframes move{
from{transform:translateX(-15px);}
to{transform:translateX(15px);}
}

h1{
font-family:'Tangerine',cursive;
font-size:48px;
font-weight:700;
color:#ff69b4;
margin-bottom:20px;
}

p{
font-family:'Quicksand',sans-serif;
font-size:1.2rem;
font-weight:500;
color:#6b0e41;
margin-bottom:20px;
}

input{
font-family:'Quicksand',sans-serif;
width:80%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:500;
text-align:center;
background:rgba(255,255,255,.8);
color:#ff69b4;
}

button{
font-family:'Dancing Script',cursive;
font-weight:600;
letter-spacing:.5px;
margin-top:15px;
padding:15px 30px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:18px;
color:white;
background:linear-gradient(45deg,#ff69b4,#ffb3d9);
}

#hint{
margin-top:15px;
color:#ff1493;
font-weight:bold;
}

.shake{
animation:shake .4s;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-10px);}
100%{transform:translateX(0);}
}

.heart{
position:absolute;
font-size:25px;
pointer-events:none;
animation:floatHeart 10s linear forwards;
}

@keyframes floatHeart{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

</style>
</head>

<body>

<div class="progress"></div>

<div class="glass">

<div class="couple">
👦 💖 👧
</div>

<h1>💖 Love Question</h1>

<p>
Our love anniversary?
</p>

<input type="text" autocomplete="username" style="display:none">
<input type="password" autocomplete="new-password" style="display:none">

<input
type="search"
id="answer"
name="loveAnniversary"
placeholder="Type answer"
autocomplete="new-password"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
inputmode="text">

<br>

<button onclick="checkAnswer()">
Unlock 🔓
</button>

<button onclick="showHint()">
Hint 👀
</button>

<p id="hint"></p>

</div>

<script>

window.onload=function(){

const input=document.getElementById("answer");

input.value="";

input.setAttribute(
"name",
"loveAnniversary_"+Math.random().toString(36).substring(2)
);

};

function checkAnswer(){

let answer=document.getElementById("answer").value.toLowerCase().trim();

if(answer==="december 7" || answer==="7 december"){
    document.body.innerHTML += `

<div style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,192,203,.95);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:2rem;
color:#ff1493;
z-index:9999;
">

<h1>💖 Correct 💖</h1>

<p>Page 4 Unlocking...</p>

</div>

`;

setTimeout(()=>{

window.location.href="page4.html";

},3000);

}else{

let input=document.getElementById("answer");

input.classList.add("shake");

setTimeout(()=>{

input.classList.remove("shake");

},500);

alert("Wrong Answer ❌");

}

}

function showHint(){

document.getElementById("hint").innerHTML=
"Hint: It's the month of our anniversary ❤️";

}

setInterval(()=>{

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML=
["💖","💕","💗","💓","💘","💞"][Math.floor(Math.random()*6)];

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},10000);

},300);

</script>

<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script src="music.js"></script>

</body>
</html>
